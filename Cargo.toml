[package]
name = "vpkbench"
version = "0.1.0"
edition = "2021"

[lib]
name = "phe"
description = "VPKbench: A benchmark suite for privacy-preserving vector search under partial homomorphic encryption"
license = "MIT"
keywords = ["cryptography", "homomorphic-encryption", "vector-search", "privacy", "benchmark"]
categories = ["cryptography", "mathematics"]

[dependencies]
# Linear Algebra
ndarray = { version = "0.16", features = ["rayon", "blas", "serde"] }
nalgebra = "0.33"
rand = "0.8"
rand_distr = "0.4"

# Cryptography
crypto-bigint = { version = "0.5", features = ["rand"] }
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
num-integer = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Performance
rayon = "1.10"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
itertools = "0.14"

# Async runtime
tokio = { version = "1.42", features = ["full"] }
async-trait = "0.1"

# Database
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
postgres-types = { version = "0.2", features = ["derive"] }

# HTTP client and server
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Streaming
async-stream = "0.3"
futures-util = "0.3"

# Homomorphic Encryption (Microsoft SEAL)
sealy = "0.2"

# Hashing
blake3 = "1.5"

# UUID
uuid = { version = "1.11", features = ["v4", "serde"] }

# PGVector — local persistent vector storage backend
pgvector = { version = "0.4", features = ["postgres"] }

# Configuration
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Memory security
zeroize = "1.8"
whoami = "2.1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"
approx = "0.5"
tempfile = "3.14"
tokio-test = "0.4"

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
